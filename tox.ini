[tox]
envlist = py38,py39,pylint,pydocstyle,bandit

[testenv]
commands = pytest tests/ --maxfail=1 --cov-fail-under=98 --verbose --doctest-modules
deps = -rtest-requirements.txt
setenv = PYTHONPATH = {toxinidir}/src

[testenv:coverage]
skip_install = True
commands = pytest tests/ --cov=src/onapsdk --cov-report term-missing --cov-report xml
deps = -rtest-requirements.txt
setenv = PYTHONPATH = {toxinidir}/src

[testenv:pylint]
commands = pylint src/ --max-positional-arguments=55
basepython = python3.10

[testenv:pydocstyle]
commands = pydocstyle src/

[testenv:bandit]
commands = bandit -r src/onapsdk

# Deliberately kept out of envlist: mypy still reports a backlog of findings on
# src/onapsdk, so gating CI on it would block every change. Run it explicitly
# with `tox -e mypy` and escalate the config in setup.cfg as packages are cleaned.
[testenv:mypy]
commands = mypy src/onapsdk
basepython = python3.10
